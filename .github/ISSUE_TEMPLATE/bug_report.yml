name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues first. For a security problem, do not open an issue: follow the security policy instead.
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run …  2. Open …  3. See …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. v1.2.3, or the commit SHA"
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. Node 24, macOS 15, Firefox 140"
    validations:
      required: false
