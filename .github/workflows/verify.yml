name: Verify

# Reusable: install the locked dependencies and run the project's own checks.
# Node comes from the caller's .nvmrc. Lifecycle scripts are disabled on install, so
# CI runs only the declared tooling. `npm test` and `npm run check` run when the
# package.json defines them; `extra-commands` runs last, in the same directory.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that holds package.json and package-lock.json, relative to the repository root.
        type: string
        default: '.'
      node-version-file:
        description: File that pins the Node version, relative to the repository root.
        type: string
        default: '.nvmrc'
      extra-commands:
        description: Shell commands to run after the tests, one per line (bash, fails on the first error).
        type: string
        default: ''

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: npm test
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "package.json has no test script; skipped."
          fi

      - name: npm run check
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.check ? 0 : 1)'; then
            npm run check
          else
            echo "package.json has no check script; skipped."
          fi

      - name: Extra commands
        if: ${{ inputs.extra-commands != '' }}
        env:
          EXTRA_COMMANDS: ${{ inputs.extra-commands }}
        run: bash -euo pipefail -c "$EXTRA_COMMANDS"
