name: AI footer strip

# Reusable. Removes an AI footer line ("Generated by [Claude Code](…)" and its variants)
# from an issue, pull request description, comment or review written by the maintainer
# account, right when it is posted or edited. Only a line that is entirely such a footer goes, plus the blank lines
# it leaves at the end; nothing else in the text changes (a Co-Authored-By line stays).
# It reads the body from the event through environment variables (never interpolated
# into the script), checks out nothing and runs no code from the repository. Each edit
# leaves a notice and a line in the job summary; it never posts a comment.
# Based on free-llm-api-hub's .github/workflows/ai-footer-strip.yml.
# tests/ai-footer-strip.test.mjs runs the script below as it is written here.
on:
  workflow_call:

permissions: {}

jobs:
  strip:
    name: strip AI footer
    if: >-
      (github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.action == 'edited') &&
        github.event.pull_request.user.login == 'pacocartones') ||
      (github.event_name == 'issues' &&
        (github.event.action == 'opened' || github.event.action == 'edited') &&
        github.event.issue.user.login == 'pacocartones') ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (github.event.action == 'created' || github.event.action == 'edited') &&
        github.event.comment.user.login == 'pacocartones') ||
      (github.event_name == 'pull_request_review' &&
        (github.event.action == 'submitted' || github.event.action == 'edited') &&
        github.event.review.user.login == 'pacocartones')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      AUTHOR: ${{ github.event.review.user.login || github.event.comment.user.login || github.event.pull_request.user.login || github.event.issue.user.login }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      REVIEW_BODY: ${{ github.event.review.body }}
      PR_BODY: ${{ github.event.pull_request.body }}
      ISSUE: ${{ github.event.issue.number }}
      PR: ${{ github.event.pull_request.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      REVIEW_ID: ${{ github.event.review.id }}
      URL: ${{ github.event.review.html_url || github.event.comment.html_url || github.event.pull_request.html_url || github.event.issue.html_url }}
    steps:
      - name: Remove the footer if there is one
        id: strip
        run: |
          set -euo pipefail
          if [ "$AUTHOR" != "pacocartones" ]; then
            echo "not written by the maintainer account"
            exit 0
          fi
          method=PATCH
          case "$EVENT" in
            issues)
              body=$ISSUE_BODY id=$ISSUE endpoint="repos/$REPO/issues/$ISSUE" ;;
            pull_request)
              body=$PR_BODY id=$PR endpoint="repos/$REPO/pulls/$PR" ;;
            issue_comment)
              body=$COMMENT_BODY id=$COMMENT_ID endpoint="repos/$REPO/issues/comments/$COMMENT_ID" ;;
            pull_request_review_comment)
              body=$COMMENT_BODY id=$COMMENT_ID endpoint="repos/$REPO/pulls/comments/$COMMENT_ID" ;;
            pull_request_review)
              # GitHub updates a review's body with PUT, not PATCH.
              body=$REVIEW_BODY id=$REVIEW_ID endpoint="repos/$REPO/pulls/$PR/reviews/$REVIEW_ID" method=PUT ;;
            *)
              echo "nothing to do for $EVENT"
              exit 0 ;;
          esac
          printf '%s' "$body" > "$RUNNER_TEMP/body.md"
          # A line that is only the footer: optional robot emoji, _ or * emphasis,
          # "Generated by|with", "Claude Code" or "[Claude Code](url)", optional final period.
          # Everything else is kept byte for byte.
          perl -0777 -pe 's/^[ \t]*(?:\xF0\x9F\xA4\x96[ \t]*)?[_*]{0,2}[ \t]*(?:\xF0\x9F\xA4\x96[ \t]*)?generated[ \t]+(?:by|with)[ \t]+(?:\[claude[ \t]+code\]\([^()\s]*\)|claude[ \t]+code)[ \t]*[_*]{0,2}\.?[_*]{0,2}[ \t]*\r?(?:\n|\z)//gim' \
            "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/stripped.md"
          if cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/stripped.md"; then
            echo "no AI footer"
            exit 0
          fi
          # Then the blank lines the footer leaves at the end.
          perl -0777 -pe 's/(?:\r?\n[ \t]*)+\z//' "$RUNNER_TEMP/stripped.md" > "$RUNNER_TEMP/clean.md"
          jq -Rs '{body: .}' "$RUNNER_TEMP/clean.md" > "$RUNNER_TEMP/payload.json"
          gh api -X "$method" "$endpoint" --input "$RUNNER_TEMP/payload.json" > /dev/null
          echo "::notice::Removed an AI footer: $EVENT $id $URL"
          echo "- Removed an AI footer: $EVENT $id $URL" >> "$GITHUB_STEP_SUMMARY"
